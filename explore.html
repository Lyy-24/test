<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>廢棄校舍探索中...</title>
  <style>
    body { background: #090a0f; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; max-width: 850px; margin: auto; padding: 20px; }
    .status-bar { background: #1e293b; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; border: 1px solid #334155; }
    .rooms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
    .room-btn { background: #1e1b4b; color: #e0e7ff; border: 1px solid #4338ca; padding: 20px; border-radius: 10px; font-size: 18px; cursor: pointer; transition: 0.2s; }
    .room-btn:hover { background: #312e81; transform: translateY(-2px); }
    .room-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .log-box { background: #111827; border: 1px solid #374151; padding: 20px; border-radius: 10px; min-height: 160px; }
    .treasure-tag { background: #b45309; color: white; padding: 3px 10px; border-radius: 12px; font-size: 13px; margin-right: 5px; }
  </style>
</head>
<body>
  <h2 style="color:#f59e0b;">🔦 深夜的廢棄校舍（目標：集齊 3 件秘寶並存活）</h2>
  <div id="statusBar" class="status-bar">正在讀取冒險者狀態...</div>

  <div class="rooms">
    <button class="room-btn" onclick="explore('舊教室')">🚪 探索【一樓：舊教室】</button>
    <button class="room-btn" onclick="explore('音樂教室')">🎹 探索【二樓：音樂教室】</button>
    <button class="room-btn" onclick="explore('舊保健室')">🩺 探索【一樓：舊保健室】</button>
    <button class="room-btn" onclick="explore('校長室')">🔑 探索【三樓：校長室】</button>
  </div>

  <div class="log-box" id="eventLog">
    <p style="color:#94a3b8;">手電筒的光束在走廊盡頭閃爍，請選擇一個教室推門進去...</p>
  </div>

  <div style="margin-top:20px; text-align:center;">
    <button onclick="location.href='index.html'" style="background:#475569; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer;">返回大廳</button>
    <button onclick="location.href='admin.html'" style="background:#047857; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer;">查看倖存者排行榜</button>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwbf09HUXzjxLQCvq6GGefg0FiJR_M_iN2XFWLb7NSqBsxrnxHXtqlZ5eMLXI9JzLqlPg/exec';
    const saveId = localStorage.getItem('currentSaveId');
    if (!saveId) { alert('請先在大廳建立或選擇存檔！'); location.href = 'index.html'; }

    async function callAPI(payload) {
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
      return await res.json();
    }

    async function loadState() {
      const res = await callAPI({ action: 'getInitLobby' });
      const player = res.data.records.find(r => r.SaveID === saveId);
      if (!player) return alert('找不到存檔資料');
      renderStatus(player);
    }

    function renderStatus(p) {
      const tList = p.Treasures ? String(p.Treasures).split(',') : [];
      document.getElementById('statusBar').innerHTML = `
        <div>👤 <strong>${p.PlayerName}</strong>（${p.CharName}）</div>
        <div>❤️ 體力 HP：<strong>${p.HP}</strong> ｜ 🧠 理智 SAN：<strong>${p.SAN}</strong></div>
        <div>🎒 秘寶 (${tList.length}/3)：${tList.map(t => `<span class="treasure-tag">${t}</span>`).join('') || '尚無'}</div>
      `;
      if (p.Status !== '探索中') {
        document.querySelectorAll('.room-btn').forEach(b => b.disabled = true);
      }
    }

    async function explore(locationName) {
      const log = document.getElementById('eventLog');
      log.innerHTML = `<p style="color:#fbbf24;">👣 你躡手躡腳走進了【${locationName}】，正在四處張望...</p>`;
      document.querySelectorAll('.room-btn').forEach(b => b.disabled = true);

      const res = await callAPI({ action: 'exploreRoom', saveId, location: locationName });
      document.querySelectorAll('.room-btn').forEach(b => b.disabled = false);

      if (res.status !== 'success') return alert(res.message);
      const { event, gotNewTreasure, playerState } = res.data;
      renderStatus(playerState);

      let endMsg = '';
      if (playerState.Status === '逃脫成功') {
        endMsg = `<h3 style="color:#34d399;">🎉 恭喜！你集齊了 3 件秘寶並成功逃出廢棄校舍！成績已登錄至倖存榜！</h3>`;
      } else if (playerState.Status === '探索失敗') {
        endMsg = `<h3 style="color:#f87171;">💀 你的體力或理智已耗盡，永遠留在了這座校舍裡...</h3>`;
      }

      log.innerHTML = `
        <h3 style="color:#f59e0b;">【${event.Type}】${event.Title}</h3>
        <p style="font-size:17px;">${event.Content}</p>
        <p style="color:#94a3b8;">數值變化：HP ${event.HP_Diff >= 0 ? '+'+event.HP_Diff : event.HP_Diff} ｜ SAN ${event.SAN_Diff >= 0 ? '+'+event.SAN_Diff : event.SAN_Diff}</p>
        ${gotNewTreasure ? `<p style="color:#fbbf24; font-weight:bold;">✨ 獲得關鍵秘寶：【${event.TreasureName}】！</p>` : ''}
        ${endMsg}
      `;
    }

    loadState();
  </script>
</body>
</html>
